<style>
/* 配色與風格跟「神隱少年團Podcast關鍵字搜尋」一致 */
:root{
  --page:#f4efe6; --ink:#1b1a18; --muted:#6e675c; --paper:#ffffff; --line:#e6dfd2;
  --amber:#edb65a; --hl:#ffe45c; --blue:#8ccbe6;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
  line-height:1.7;min-height:100vh}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- 頁首 ---------- */
header{padding:36px 0 6px}
.brand{display:flex;align-items:center;gap:18px}
.logo{flex:none;width:84px;height:84px;border-radius:50%;background:var(--amber);display:grid;place-items:center;
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:50px;color:#fff;line-height:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);text-decoration:none}
#cover{display:none !important}
.brand .grow{flex:1;min-width:0}
.brand h1{margin:0;font-weight:900;font-size:clamp(26px,5vw,40px);letter-spacing:.04em;line-height:1.15}
.brand h1 .nw{display:inline-block;white-space:nowrap}
.brand .full{margin:4px 0 0;font-size:13px;color:var(--muted);letter-spacing:.02em}
.hbtn{flex:none;align-self:flex-start;border:2px solid #1b1a18;background:var(--paper);color:#1b1a18;border-radius:999px;
  padding:3px 12px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:2px 2px 0 #1b1a18}
.hbtn:hover{background:var(--hl)}
.tagline{display:inline-block;margin-top:14px;font-weight:700;font-size:15px;padding:0 6px;
  background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 92%,transparent 92%);color:#1b1a18}
.notice{margin:16px 0 0;background:var(--paper);color:#1b1a18;border:2px solid #1b1a18;border-radius:12px;padding:10px 14px;
  font-size:13.5px;line-height:1.65;box-shadow:3px 3px 0 #1b1a18}

/* ---------- 歡迎區 ---------- */
#thread{padding:8px 0 200px}
.welcome{padding:26px 0 8px}
.welcome h2{font-size:24px;font-weight:900;margin:0 0 6px;line-height:1.4}
.welcome p{color:var(--muted);margin:0 0 16px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #1b1a18;background:var(--paper);color:#1b1a18;border-radius:8px;padding:5px 12px;font-size:14.5px;font-weight:700;
  cursor:pointer;font-family:inherit;text-align:left;line-height:1.45}
.chip:hover{background:var(--hl)}

/* ---------- 對話 ---------- */
.msg{margin:22px 0;display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;border-radius:14px;padding:10px 16px;word-break:break-word}
.user .bubble{background:#1b1a18;color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap;font-weight:500}
.bot{flex-direction:column}
.bot .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
.mini-logo{width:26px;height:26px;border-radius:50%;background:var(--amber);display:grid;place-items:center;
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;color:#fff;line-height:1}
.bot .bubble{max-width:100%;background:var(--paper);color:#1b1a18;border:2px solid #1b1a18;border-top-left-radius:4px;
  box-shadow:4px 4px 0 #1b1a18;padding:14px 18px;font-size:16px}
.bubble p{margin:0 0 .7em}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.2em 0 .8em;padding-left:1.4em}
.bubble li{margin:.2em 0}
.bubble b{background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 92%,transparent 92%)}
.cite{display:inline-flex;align-items:center;gap:3px;border:1.5px solid #1b1a18;background:var(--amber);color:#1b1a18;
  border-radius:6px;padding:0 6px;margin:0 2px;font-size:12.5px;font-weight:900;cursor:pointer;vertical-align:1px;
  font-variant-numeric:tabular-nums;font-family:inherit;line-height:1.55;box-shadow:1.5px 1.5px 0 #1b1a18}
.cite:hover{background:var(--hl)}
.cite:active{transform:translate(1.5px,1.5px);box-shadow:none}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--amber);border:1.5px solid #1b1a18;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.status{color:var(--muted);font-size:14px}
.err{color:#b4321e;font-size:15px;font-weight:700}

/* ---------- 參考片段（拍立得卡片） ---------- */
details.src{margin-top:12px;font-size:14px}
details.src summary{cursor:pointer;color:var(--ink);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0;
  text-decoration:underline;text-underline-offset:3px}
details.src summary::-webkit-details-marker{display:none}
details.src summary::before{content:"▸";font-size:11px;transition:transform .15s;text-decoration:none}
details.src[open] summary::before{transform:rotate(90deg)}
.srcs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.srcs li{background:var(--paper);color:#1b1a18;border:2px solid #1b1a18;border-left:8px solid var(--blue);border-radius:10px;padding:10px 12px}
.srcs li.flash{background:#fff8d6}
.s-head{display:flex;gap:10px;align-items:flex-start}
.s-n{flex:none;font-family:"Bebas Neue","Noto Sans TC",sans-serif;font-size:22px;line-height:1.1;min-width:18px}
.s-title{flex:1;min-width:0;font-weight:900;line-height:1.5}
.s-title small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.play{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid #1b1a18;background:var(--amber);color:#1b1a18;
  border-radius:8px;padding:2px 10px;font-size:14px;font-weight:900;cursor:pointer;font-variant-numeric:tabular-nums;font-family:inherit;
  box-shadow:2px 2px 0 #1b1a18}
.play:active{transform:translate(2px,2px);box-shadow:none}
.s-text{color:#4d473e;font-size:13.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.s-text.full{display:block}

/* ---------- 輸入框 ---------- */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:8;background:linear-gradient(to top,var(--page) 72%,rgba(244,239,230,0));
  padding:18px 0 calc(14px + env(safe-area-inset-bottom));transition:bottom .25s}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--paper);border:3px solid #1b1a18;border-radius:14px;
  padding:5px 6px 5px 16px;box-shadow:4px 4px 0 #1b1a18}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#1b1a18;font-size:17px;font-weight:500;padding:9px 0;
  font-family:inherit;resize:none;max-height:140px;line-height:1.5}
#send{flex:none;width:44px;height:44px;border-radius:10px;border:2px solid #1b1a18;background:var(--amber);color:#1b1a18;cursor:pointer;
  display:grid;place-items:center}
#send:disabled{opacity:.4;cursor:default}
.hint{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;padding:0 6px;font-weight:500}
.hint button{border:0;background:none;color:var(--ink);cursor:pointer;font-size:12px;padding:0;font-family:inherit;font-weight:700;text-decoration:underline}

/* ---------- 播放器 ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--amber);border-top:3px solid #1b1a18;color:#1b1a18;
  transform:translateY(110%);transition:transform .25s}
.player.show{transform:none}
.player .wrap{display:flex;flex-direction:column;gap:6px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.p-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-actions{display:flex;gap:6px;flex:none}
.p-actions button,.p-actions a{border:2px solid #1b1a18;background:#fff;color:#1b1a18;border-radius:8px;padding:1px 10px;font-size:13px;
  font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
audio{width:100%;height:40px}
body.playing .composer{bottom:100px}
body.playing #thread{padding-bottom:300px}
/* ---------- 主持人頭像 ---------- */
.av{flex:none;display:inline-block;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #1b1a18;vertical-align:middle}
.hosts{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;font-weight:700;color:var(--muted)}
.hosts .pair{display:flex}
.hosts .pair .av{width:40px;height:40px}
.hosts .pair .av + .av{margin-left:-10px}
.host-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px}
.host-card{background:var(--paper);color:#1b1a18;border:2px solid #1b1a18;border-radius:12px;padding:12px 14px;box-shadow:3px 3px 0 #1b1a18;
  display:flex;gap:12px;align-items:flex-start}
.host-card .av{width:60px;height:60px}
.host-card .info{flex:1;min-width:0}
.host-card b{font-size:17px;font-weight:900}
.host-card small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.5}
.host-card .qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.host-card .qs .chip{font-size:13px;padding:2px 9px;border-width:1.5px}
.spk{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:#1b1a18;font-size:12.5px;margin-right:3px;white-space:nowrap;vertical-align:-1px}
.spk .av{width:20px;height:20px;border-width:1.5px}
.spk .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #1b1a18;display:inline-grid;place-items:center;font-size:11px;background:#e6dfd2;line-height:1}
@media (max-width:560px){
  .host-cards{grid-template-columns:1fr}
}
@media (max-width:560px){
  header{padding-top:22px}
  .brand{gap:12px}
  .logo{width:60px;height:60px;font-size:36px}
  .hbtn{display:none}
  .welcome h2{font-size:21px}
  .bot .bubble{padding:12px 14px;font-size:15.5px;box-shadow:3px 3px 0 #1b1a18}
}

/* ---------- 動態背景：緩慢飄動的漫畫網點（跟關鍵字搜尋站一樣） ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg .tone{position:absolute;inset:-60px;
  background-image:radial-gradient(rgba(27,26,24,.075) 1.6px,transparent 1.8px);background-size:22px 22px;
  animation:tone 28s linear infinite;will-change:transform}
@keyframes tone{to{transform:translate(22px,22px)}}
@media (max-width:760px){ .bg .tone{opacity:.8} }
@media (prefers-reduced-motion: reduce){ .bg .tone{animation:none} }
</style>
</head>

<div class="bg" aria-hidden="true"><div class="tone"></div></div>
<div class="wrap">

<script>
(function () {
  "use strict";
  var CFG = window.ASK_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var thread = $("thread"), form = $("form"), q = $("q"), send = $("send");
  var retriever = null, busy = false, history = [];
  var SUGGEST = [
    "你們怎麼看《葬送的芙莉蓮》？", "第 120 集在聊什麼？", "MyGO 哪幾集有聊到？", "有推薦適合夏天看的作品嗎？",
    "你們對「過氣」有什麼看法？", "節目有聊過宮崎駿嗎？", "你們小時候玩什麼電玩？", "有推薦哪些冷門但好看的動畫？",
    "你們覺得 AI 繪圖怎麼樣？", "EVA 研討會聊了什麼？", "哪一集最適合第一次聽的人？", "你們怎麼看待二刷作品？"
  ];

  $("search-link").href = CFG.SEARCH_URL || "#";

  /* 匿名統計聽眾問了什麼（GoatCounter，和搜尋站共用；不記瀏覽人次、不記是誰問的）。config.js 的 GOATCOUNTER 空白就不統計 */
  if (CFG.GOATCOUNTER) {
    var gc = document.createElement("script");
    gc.async = true; gc.src = "https://gc.zgo.at/count.js";
    gc.dataset.goatcounter = "https://" + CFG.GOATCOUNTER + ".goatcounter.com/count";
    gc.dataset.goatcounterSettings = JSON.stringify({ no_onload: true });
    document.head.appendChild(gc);
  }
  function track(question, found) {
    if (!CFG.GOATCOUNTER || !window.goatcounter || !window.goatcounter.count) return;
    var t = question.replace(/\s+/g, " ").trim().slice(0, 80);
    try { window.goatcounter.count({ path: (found ? "問問節目/" : "問問節目（沒找到）/") + t, title: t, event: true }); } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function renderChips() {
    var box = $("chips"); box.innerHTML = "";
    shuffle(SUGGEST).slice(0, 6).forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = s;
      b.onclick = function () { ask(s); };
      box.appendChild(b);
    });
  }
  renderChips();
  Array.prototype.forEach.call(document.querySelectorAll("#host-cards .chip"), function (b) {
    b.onclick = function () { ask(b.dataset.q); };
  });

  /* 說話者標記【二百五】→ 頭像 */
  var AVATAR = { "二百五": "img/host-250.webp", "鳳梨": "img/host-pineapple.webp" };
  function speakerHtml(text) {
    return esc(text).replace(/【([^】]{1,20})】/g, function (m, name) {
      if (AVATAR[name]) return '<span class="spk"><img class="av" src="' + AVATAR[name] + '" alt="">' + esc(name) + "：</span>";
      if (name === "？") return '<span class="spk"><span class="dot">?</span></span>';
      return '<span class="spk"><span class="dot">客</span>' + esc(name) + "：</span>";
    });
  }


  /* ---------- 載入逐字稿 ---------- */
  /* 和搜尋站共用同一份瀏覽器快取：在搜尋站看過的聽眾，這裡就不用再下載一次 */
  var CACHE = "podcast-search-data";
  function download(url, total) {
    var status = $("load-status");
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      if (!r.body || !r.body.getReader) return r.text();
      var reader = r.body.getReader(), parts = [], got = 0;
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) return;
          parts.push(res.value); got += res.value.length;
          status.textContent = "正在載入節目逐字稿… " + (total ? Math.min(100, Math.round(got / total * 100)) + "%（" : "") +
            (got / 1048576).toFixed(1) + (total ? " / " + (total / 1048576).toFixed(1) : "") + " MB" + (total ? "）・下次打開就不用再等了" : "");
          return pump();
        });
      }
      return pump().then(function () {
        var all = new Uint8Array(got), off = 0;
        parts.forEach(function (p) { all.set(p, off); off += p.length; });
        return new TextDecoder("utf-8").decode(all);
      });
    });
  }
  function loadFromSite() {
    var base = CFG.DATA_URL.replace(/data\.json.*$/, "");
    var ver = null, cache = null, key = "";
    return fetch(base + "data-version.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      .then(function (v) {
        ver = v;
        key = new URL(CFG.DATA_URL + "?v=" + (ver ? ver.v : "nov"), location.href).href;
        return window.caches ? caches.open(CACHE).catch(function () { return null; }) : null;
      })
      .then(function (c) {
        cache = c;
        return cache && ver ? cache.match(key).catch(function () { return null; }) : null;
      })
      .then(function (hit) {
        if (hit) return hit.text();
        return download(key, ver ? ver.bytes : 0).then(function (text) {
          if (cache && ver) {
            cache.put(key, new Response(text, { headers: { "Content-Type": "application/json" } }))
              .then(function () { return cache.keys(); })
              .then(function (keys) { keys.forEach(function (k) { if (k.url !== key) cache.delete(k); }); })
              .catch(function () {});
          }
          return text;
        });
      })
      .then(function (text) { return JSON.parse(text); });
  }
  function loadData() {
    var status = $("load-status");
    var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    var p = local ? download("local_data.json", 0).then(JSON.parse).catch(loadFromSite) : loadFromSite();
    p.then(function (data) {
      retriever = new PodcastRetriever(data);
      var show = data.show || {};
      if (show.image) { var c = $("cover"); c.src = show.image; c.hidden = false; }
      status.textContent = "已讀完 " + data.episodes.length + " 集逐字稿（更新到 " + (data.built || "") + "）。可以點下面的問題，或自己打字問：";
      send.disabled = !q.value.trim();
      if (!CFG.WORKER_URL) status.innerHTML += '<br><span class="err">⚠ 網站還沒設定 AI 中繼服務（config.js 的 WORKER_URL），目前只能看到找到的逐字稿片段。</span>';
    }).catch(function () {
      status.innerHTML = '<span class="err">逐字稿載入失敗，請重新整理頁面再試一次。</span>';
    });
  }
  loadData();

  /* ---------- 輸入框 ---------- */
  function autosize() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; }
  q.addEventListener("input", function () { autosize(); send.disabled = busy || !retriever || !q.value.trim(); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.onsubmit(e); }
  });
  form.addEventListener("submit", function (e) { e.preventDefault(); var t = q.value.trim(); if (t) ask(t); });
  $("reset").onclick = function () {
    if (busy) return;
    history = [];
    Array.prototype.slice.call(thread.querySelectorAll(".msg")).forEach(function (n) { n.remove(); });
    $("welcome").hidden = false; $("reset").hidden = true; renderChips(); q.focus();
  };

  /* ---------- 簡易排版：段落、粗體、清單、出處標記 ---------- */
  function renderAnswer(text, sources) {
    var byN = {}; sources.forEach(function (s) { byN[s.n] = s; });
    function inline(s) {
      s = esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      return s.replace(/\[(\d{1,2})\]/g, function (m, n) {
        var src = byN[+n];
        if (!src) return "";
        var label = (src.title.match(/^(EP\.?\s*[\d-]+|【[^】]+】|[^：:｜|]{1,8})/) || [src.title.slice(0, 6)])[0];
        return '<button type="button" class="cite" data-n="' + n + '" title="' + esc(src.title + "・" + src.time) + '">' +
          esc(label.replace(/\s+/g, "")) + " " + (src.kind ? "整集" : src.time) + "</button>";
      });
    }
    var html = "", list = null;
    text.split(/\n/).forEach(function (line) {
      var m = line.match(/^\s*(?:[-*•]|(\d+)[.、)])\s+(.*)$/);
      if (m) {
        var type = m[1] ? "ol" : "ul";
        if (list !== type) { if (list) html += "</" + list + ">"; html += "<" + type + ">"; list = type; }
        html += "<li>" + inline(m[2]) + "</li>";
        return;
      }
      if (list) { html += "</" + list + ">"; list = null; }
      if (line.trim()) html += "<p>" + inline(line.replace(/^#+\s*/, "")) + "</p>";
    });
    if (list) html += "</" + list + ">";
    return html;
  }

  function sourcesHtml(sources) {
    if (!sources.length) return "";
    var items = sources.map(function (s) {
      return '<li data-n="' + s.n + '"><div class="s-head"><span class="s-n">' + s.n + '</span>' +
        '<span class="s-title">' + esc(s.title) + "<small>" + esc(s.date || "") + (s.kind ? "・集數摘要（AI 整理）" : "") + (s.approx ? "・時間為估計值" : "") + "</small></span>" +
        '<button type="button" class="play" data-n="' + s.n + '">▶ ' + s.time + "</button></div>" +
        '<div class="s-text">' + speakerHtml(s.text) + "</div></li>";
    }).join("");
    return '<details class="src"><summary>參考了 ' + sources.length + " 段節目內容</summary><ul class=\"srcs\">" + items + "</ul></details>";
  }

  function addMsg(cls, html) {
    $("welcome").hidden = true;
    var div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerHTML = html;
    thread.appendChild(div);
    return div;
  }

  function scrollDown() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

  /* ---------- 問問題 ---------- */
  function ask(question) {
    if (busy || !retriever) return;
    busy = true; send.disabled = true; q.value = ""; autosize();
    $("reset").hidden = false;
    addMsg("user", '<div class="bubble">' + esc(question) + "</div>");

    // 追問（很短或用「那／它／這部」開頭）時，把上一題一起拿去找資料
    var prevUser = "";
    for (var i = history.length - 1; i >= 0; i--) if (history[i].role === "user") { prevUser = history[i].text; break; }
    var followUp = prevUser && (question.length < 14 || /^(那|它|他|這部|這個|那部|那個|所以|還有)/.test(question));
    var found = retriever.search(question, followUp ? prevUser : "");
    var sources = found.sources;
    track(question, sources.length > 0);

    var cover = '<span class="mini-logo" aria-hidden="true">隱</span>';
    var bot = addMsg("bot", '<div class="who">' + cover + "神隱少年團 AI（模仿口吻）</div>" +
      '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>');
    var bubble = bot.querySelector(".bubble");
    bot._sources = sources;
    scrollDown();

    function finish(text) {
      bubble.innerHTML = renderAnswer(text, sources) || '<p class="status">（沒有回答）</p>';
      bot.insertAdjacentHTML("beforeend", sourcesHtml(sources));
      history.push({ role: "user", text: question });
      history.push({ role: "model", text: text.replace(/\[\d{1,2}\]/g, "") });
      if (history.length > 8) history = history.slice(-8);
      busy = false; send.disabled = !q.value.trim();
      q.focus();
    }
    function fail(msg) {
      bubble.innerHTML = '<p class="err">' + esc(msg) + "</p>" +
        (sources.length ? '<p class="status">先看看找到的節目片段吧 👇</p>' : "");
      bot.insertAdjacentHTML("beforeend", sourcesHtml(sources));
      var d = bot.querySelector("details"); if (d) d.open = true;
      busy = false; send.disabled = !q.value.trim();
    }

    if (!CFG.WORKER_URL) { fail("AI 中繼服務還沒設定好。"); return; }

    var payload = {
      question: question,
      history: history.slice(-6),
      sources: sources.map(function (s) { return { n: s.n, title: s.title, date: s.date, time: s.kind ? "整集" : s.time, text: s.text.slice(0, 1800) }; }),
      catalog: retriever.catalog(question)
    };
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 90000); // 90 秒沒回應就放棄
    fetch(CFG.WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(j.message || "AI 暫時沒有回應，晚點再試試。"); });
        var reader = r.body.getReader(), dec = new TextDecoder("utf-8"), buf = "", text = "", blocked = false;
        function handle(line) {
          if (line.indexOf("data:") !== 0) return;
          var j; try { j = JSON.parse(line.slice(5)); } catch (e) { return; }
          if (j.promptFeedback && j.promptFeedback.blockReason) blocked = true;
          var c = j.candidates && j.candidates[0];
          if (c && c.content && c.content.parts) c.content.parts.forEach(function (p) { if (p.text && !p.thought) text += p.text; });
          if (c && c.finishReason === "SAFETY") blocked = true;
        }
        var last = 0;
        function pump() {
          return reader.read().then(function (res) {
            if (!res.done) {
              buf += dec.decode(res.value, { stream: true });
              var lines = buf.split(/\r?\n/); buf = lines.pop();
              lines.forEach(handle);
              var now = Date.now();
              if (text && now - last > 80) { last = now; bubble.innerHTML = renderAnswer(text, sources); }
              return pump();
            }
            if (buf) handle(buf);
            if (!text) throw new Error(blocked ? "這個問題 AI 不方便回答，換個問法試試？" : "AI 沒有回答，再試一次看看。");
            finish(text);
          });
        }
        return pump();
      })
      .then(function () { clearTimeout(timer); })
      .catch(function (e) {
        clearTimeout(timer);
        if (e && e.name === "AbortError") return fail("AI 等太久沒有回應，晚點再試試。");
        fail(e && e.message && !/fetch|network/i.test(e.message) ? e.message : "連不上 AI 服務，請檢查網路後再試。");
      });
  }

  /* ---------- 播放 ---------- */
  var audio = $("audio"), player = $("player"), current = "";
  function play(src) {
    $("p-title").textContent = src.title + "・" + src.time;
    $("p-link").href = src.link || "#";
    player.classList.add("show"); document.body.classList.add("playing");
    var seek = function () { try { audio.currentTime = src.start; } catch (e) {} audio.play().catch(function () {}); };
    if (current !== src.audio) {
      current = src.audio; audio.src = src.audio; audio.preload = "auto";
      audio.addEventListener("loadedmetadata", function once() { audio.removeEventListener("loadedmetadata", once); seek(); });
      audio.load();
    } else seek();
  }
  $("p-close").onclick = function () { audio.pause(); player.classList.remove("show"); document.body.classList.remove("playing"); };

  thread.addEventListener("click", function (e) {
    var t = e.target.closest(".cite, .play, .s-text");
    if (!t) return;
    if (t.classList.contains("s-text")) { t.classList.toggle("full"); return; }
    var msg = t.closest(".msg"), n = +t.dataset.n;
    var src = (msg._sources || []).filter(function (s) { return s.n === n; })[0];
    if (!src) return;
    play(src);
    if (t.classList.contains("cite")) {
      var d = msg.querySelector("details.src"); if (d) d.open = true;
      var li = msg.querySelector('.srcs li[data-n="' + n + '"]');
      if (li) { li.classList.add("flash"); setTimeout(function () { li.classList.remove("flash"); }, 1600); }
    }
  });
})();
</script>
</body>
